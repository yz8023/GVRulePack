plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ---------------------------------------------------------------------------
// 「GV 规则工坊」——模块工厂 App：
//   导入 GodViewer 导出的 JSON（文件 / 剪贴板）→ 配置包名/名称/版本/签名
//   → 用内置模板（assets/template.apk）+ ARSCLib 二进制改包 + apksig 重签名
//   → 导出独立的 LSPosed 规则模块 APK（本 App 自身不是模块）。
// ---------------------------------------------------------------------------
def cfgApplicationId = (findProperty("cfgApplicationId") ?: "io.github.gvrulepack.app").toString()
def cfgAppLabel = (findProperty("cfgAppLabel") ?: "GV 规则工坊").toString()
// 版本默认值来自 version.properties（单一来源），cfg 属性仍可覆盖
def vp = new Properties()
def vpFile = rootProject.file("version.properties")
if (vpFile.exists()) { vpFile.withInputStream { vp.load(it) } }
def cfgVersionCode = (findProperty("cfgVersionCode") ?: vp.getProperty("versionCode", "1")).toString().toInteger()
def cfgVersionName = (findProperty("cfgVersionName") ?: vp.getProperty("versionName", "0.0.0")).toString()
def cfgKeystore = findProperty("cfgKeystore")?.toString()
def cfgKeystorePassword = findProperty("cfgKeystorePassword")?.toString()
def cfgKeyAlias = findProperty("cfgKeyAlias")?.toString()
def cfgKeyPassword = findProperty("cfgKeyPassword")?.toString()
def cfgHasSigning = cfgKeystore && cfgKeystorePassword && cfgKeyAlias
def cfgLite = findProperty("cfgLiteBuild")?.toString() in ["true", "1", "yes"]

android {
    namespace 'io.github.gvrulepack.app'
    compileSdk 35

    defaultConfig {
        applicationId cfgApplicationId
        minSdk 23
        targetSdk 35
        versionCode cfgVersionCode
        versionName cfgVersionName
        if (findProperty("cfgAppLabel")) {
            manifestPlaceholders["appLabel"] = cfgAppLabel
        } else {
            manifestPlaceholders["appLabel"] = "@string/app_name"
        }
    }

    signingConfigs {
        if (cfgHasSigning) {
            cfgrelease {
                storeFile rootProject.file(cfgKeystore)
                storePassword cfgKeystorePassword
                keyAlias cfgKeyAlias
                keyPassword cfgKeyPassword ?: cfgKeystorePassword
            }
        }
    }

    buildTypes {
        release {
            // R8 曾两连环破坏运行时：v1.2.0 把 FileProvider 的 meta-data 解析裁成无条件抛异常、
            // v1.2.1 把 AppCompatDelegateImpl.onCreateView 裁成 abstract（启动即崩 AbstractMethodError）。
            // 工厂 App 是低频工具，换体积换稳定：不混淆、不收缩（模块模板 :module 仍保持混淆）。
            minifyEnabled false
            shrinkResources false
            debuggable false
            if (cfgHasSigning) {
                signingConfig signingConfigs.cfgrelease
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    testOptions {
        unitTests {
            // JVM 单元测试需要读取模板 APK 与真实文件
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation project(':common')
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    // 手机端二进制改包 + 重签名（与 SimpleHook 导出插件同一套路）
    implementation "io.github.reandroid:ARSCLib:1.4.0"
    implementation "com.android.tools.build:apksig:8.5.2"
    testImplementation "junit:junit:4.13.2"
}
