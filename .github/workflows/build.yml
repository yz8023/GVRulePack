name: build

on:
  push:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK（ANDROID_HOME 已配置，cmdline-tools 路径随镜像变化）；
      # 不再用 android-actions/setup-android——其内部 sdkmanager 调用已失效
      - name: Set up Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;34.0.0" || true
          fi
          # 硬性门禁：所需平台与构建工具必须就位
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/34.0.0/aapt2" -o -f "$ANDROID_HOME/build-tools/34.0.0/apksigner"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 仓库里放了 rulepack.properties 就会自动生效（含签名材料时注意别提交密钥本体！）；
      # 没有配置文件时打「通用版」（debug 签名）
      - name: Build via pack.py
        run: python3 pack.py

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GVRulePack
          path: dist/*.apk
