name: build

on:
  push:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # CI 内存/并发放开（仓库 gradle.properties 为低内存本地机调优：单 worker、无 daemon）
      - name: Tune Gradle for CI
        run: |
          sed -i 's/-Xmx640m/-Xmx2048m/' gradle.properties
          sed -i 's/org.gradle.workers.max=1/org.gradle.workers.max=4/' gradle.properties
          sed -i 's/org.gradle.daemon=false/org.gradle.daemon=true/' gradle.properties
          sed -i '/kotlin.compiler.execution.strategy=in-process/d' gradle.properties
          sed -i 's/kotlin.daemon.jvmargs=-Xmx384m/kotlin.daemon.jvmargs=-Xmx1024m/' gradle.properties

      # 仓库里放了 rulepack.properties 就会自动生效（含签名材料时注意别提交密钥本体！）；
      # 没有配置文件时打「通用版」（debug 签名）
      - name: Build via pack.py
        run: python3 pack.py

      # lint 只出报告不阻断（存量告警先可见、后清理）
      - name: Lint (report only)
        run: gradle :app:lintRelease :module:lintRelease --console=plain || true

      - name: Upload APK (+ sha256)
        uses: actions/upload-artifact@v4
        with:
          name: GVRulePack
          path: |
            dist/*.apk
            dist/*.sha256

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*"
          if-no-files-found: ignore
