name: build

on:
  push:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK（ANDROID_HOME 已配置）；
      # 不再用 android-actions/setup-android——新版 sdkmanager 已移除 'tools' 包导致其失败
      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 仓库里放了 rulepack.properties 就会自动生效（含签名材料时注意别提交密钥本体！）；
      # 没有配置文件时打「通用版」（debug 签名）
      - name: Build via pack.py
        run: python3 pack.py

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GVRulePack
          path: dist/*.apk
